<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MOSA</title>
    <script src="js/main.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html { scroll-behavior: smooth; }
        body { background-color: #f9fafb; font-family: 'Inter', sans-serif; }
        /* Setup a beautiful glassmorphic effect */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .form-input {
            transition: all 0.3s ease;
        }
        .form-input:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(204, 0, 0, 0.1);
            border-color: #CC0000;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div id="header-placeholder"></div>

    <main class="flex-grow flex items-center justify-center relative py-20 bg-mosaBlack">
        <!-- Background Image with Overlay -->
        <div class="absolute inset-0 z-0">
            <img src="mosa-logo.png" alt="Mengo Background" class="w-full h-full object-cover opacity-30">
            <div class="absolute inset-0 bg-gradient-to-br from-mosaBlack/90 via-mosaBlack/70 to-mosaRed/40"></div>
        </div>

        <div class="relative z-10 w-full max-w-md px-4">
            <div class="glass-panel rounded-2xl p-8 transform transition-all duration-500 hover:scale-[1.01]">
                <div class="text-center mb-8">
                    <h2 class="font-serif text-3xl font-bold text-mosaBlack mb-2">Welcome Back</h2>
                    <p class="text-gray-600">Enter your credentials to access the alumni portal.</p>
                </div>

                <form onsubmit="event.preventDefault(); window.location.href='index.html';" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-envelope text-gray-400"></i>
                            </div>
                            <input type="email" id="email" required class="form-input w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-mosaRed/20 bg-white/90" placeholder="johndoe@example.com">
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="password" class="block text-sm font-semibold text-gray-700">Password</label>
                            <a href="#" class="text-xs text-mosaRed font-semibold hover:underline">Forgot password?</a>
                        </div>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-400"></i>
                            </div>
                            <input type="password" id="password" required class="form-input w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-mosaRed/20 bg-white/90" placeholder="••••••••">
                        </div>
                    </div>

                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-mosaRed focus:ring-mosaRed border-gray-300 rounded cursor-pointer">
                        <label for="remember-me" class="ml-2 block text-sm text-gray-600 cursor-pointer">
                            Remember me
                        </label>
                    </div>

                    <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-mosaRed hover:bg-red-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-mosaRed transition-colors duration-300">
                        Sign In
                    </button>
                    
                    <div class="mt-6 text-center text-sm">
                        <p class="text-gray-600">Don't have an account? <a href="register.html" class="font-bold text-mosaRed hover:underline transition">Join MOSA</a></p>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
</body>
</html>
