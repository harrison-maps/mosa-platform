<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | MOSA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{mosaInk:'#1c1410',mosaClay:'#c81e2a',mosaGold:'#FFD500'},fontFamily:{serif:['"Fraunces"','"Playfair Display"','Georgia','serif'],sans:['"Inter"','sans-serif']}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="js/main.js"></script>
<style>
  body{font-family:'Inter',sans-serif;}
  .mengo-texture{position:relative;background:#1c1410;overflow:hidden;}
  .mengo-texture::before{content:'';position:absolute;inset:0;background-image:repeating-radial-gradient(circle at 0 0,transparent 0,transparent 26px,rgba(201,162,75,.05) 27px,transparent 28px),repeating-radial-gradient(circle at 40px 40px,transparent 0,transparent 26px,rgba(201,162,75,.05) 27px,transparent 28px);background-size:80px 80px;pointer-events:none;}
  .mengo-texture>*{position:relative;z-index:1;}
  .glass-panel{background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.3);box-shadow:0 25px 50px -12px rgba(0,0,0,.4);}
  .form-input{transition:all .3s ease;} .form-input:focus{transform:translateY(-2px);box-shadow:0 10px 15px -3px rgba(122,31,31,.12);border-color:#c81e2a;}
</style>
</head>
<body class="flex flex-col min-h-screen">

<header class="bg-mosaInk border-b border-white/10"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center"><a href="index.html" class="flex items-center gap-3"><img src="mosa-logo.png" class="w-10 h-10 object-contain" onerror="this.style.display='none'"><span class="font-serif font-bold text-white text-lg">MOSA</span></a></div></header>

<main class="flex-grow flex items-center justify-center relative py-20 mengo-texture">
  <div class="relative z-10 w-full max-w-md px-4">
    <div class="glass-panel rounded-2xl p-8">
      <div class="text-center mb-8">
        <h2 class="font-serif text-3xl font-bold text-mosaInk mb-2">Welcome Back</h2>
        <p class="text-gray-600">Enter your credentials to access the alumni portal.</p>
      </div>
      <form onsubmit="event.preventDefault(); window.location.href='index.html';" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
          <div class="relative"><div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fas fa-envelope text-gray-400"></i></div>
          <input type="email" id="email" required class="form-input w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none bg-white/90" placeholder="johndoe@example.com"></div>
        </div>
        <div>
          <div class="flex justify-between items-center mb-1"><label for="password" class="block text-sm font-semibold text-gray-700">Password</label><a href="#" class="text-xs font-semibold hover:underline" style="color:#c81e2a;">Forgot password?</a></div>
          <div class="relative"><div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fas fa-lock text-gray-400"></i></div>
          <input type="password" id="password" required class="form-input w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none bg-white/90" placeholder="••••••••"></div>
        </div>
        <div class="flex items-center"><input id="remember-me" type="checkbox" class="h-4 w-4 rounded cursor-pointer" style="accent-color:#c81e2a;"><label for="remember-me" class="ml-2 block text-sm text-gray-600 cursor-pointer">Remember me</label></div>
        <button type="submit" class="w-full flex justify-center py-3 px-4 rounded-lg shadow-sm text-sm font-bold text-white transition-colors duration-300" style="background:#c81e2a;" onmouseover="this.style.background='#5c1717'" onmouseout="this.style.background='#c81e2a'">Sign In</button>
        <div class="mt-6 text-center text-sm"><p class="text-gray-600">Don't have an account? <a href="register.html" class="font-bold hover:underline transition" style="color:#c81e2a;">Join MOSA</a></p></div>
      </form>
    </div>
  </div>
</main>

<footer class="mengo-texture text-white/40 text-xs py-6 text-center border-t border-white/5">
  <p>&copy; 2026 Mengo Old Students Association (MOSA). All Rights Reserved.</p>
</footer>
</body>
</html>
